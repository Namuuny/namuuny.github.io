<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бүртгүүлэх — Smart City Design</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            indigo: { 950: '#0B0F1A', 900: '#111827' },
            teal: { 400: '#2DD4BF', 500: '#14B8A6', 600: '#0D9488' },
            coral: { 400: '#FB7185', 500: '#F43F5E' },
            violet: { 400: '#A78BFA', 500: '#8B5CF6' },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Space Grotesk', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; }
    .card-glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .hero-bg {
      background: radial-gradient(ellipse at 30% 20%, rgba(45, 212, 191, 0.12) 0%, transparent 50%),
                  radial-gradient(ellipse at 70% 80%, rgba(139, 92, 246, 0.10) 0%, transparent 50%),
                  #0B0F1A;
    }
  </style>
</head>
<body class="bg-indigo-950 text-white antialiased min-h-screen hero-bg">

  <nav class="border-b border-white/5">
    <div class="max-w-6xl mx-auto px-5 sm:px-8 py-4 flex items-center justify-between">
      <a href="indexmn.html" class="flex items-center gap-2.5 group">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-teal-400 via-violet-500 to-coral-400 flex items-center justify-center text-indigo-950 font-bold text-xs">SC</div>
        <span class="font-display font-semibold tracking-tight group-hover:text-teal-400 transition">Smart City Design</span>
      </a>
      <div class="flex items-center gap-4">
        <a href="signup.html" class="text-xs text-gray-400 hover:text-white transition">🌐 EN | МН</a>
        <a href="login-mn.html" class="text-sm text-gray-400 hover:text-white transition">Бүртгэлтэй юу?</a>
      </div>
    </div>
  </nav>

  <main class="flex items-center justify-center px-5 py-16 sm:py-20">
    <div class="w-full max-w-md">
      <div class="text-center mb-10">
        <div class="w-14 h-14 rounded-full bg-gradient-to-br from-teal-400 via-violet-500 to-coral-400 mx-auto mb-5 flex items-center justify-center text-indigo-950 font-bold text-lg shadow-lg shadow-violet-500/20">SC</div>
        <h1 class="font-display text-3xl font-bold mb-2">Бүртгэл үүсгэх</h1>
        <p class="text-gray-400">Үнэгүй хичээлүүдийг өнөөдрөөс эхлээрэй</p>
      </div>

      <div class="card-glass rounded-3xl p-8 sm:p-10">
        <div id="error-msg" class="hidden mb-5 p-3 rounded-xl bg-coral-500/10 border border-coral-500/30 text-coral-400 text-sm"></div>

        <form id="signup-form" class="space-y-5">
          <div>
            <label for="name" class="block text-sm text-gray-400 mb-1.5">Бүтэн нэр</label>
            <input type="text" id="name" name="name" required placeholder="Таны нэр"
              class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500/30 transition">
          </div>
          <div>
            <label for="email" class="block text-sm text-gray-400 mb-1.5">И-мэйл</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com"
              class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500/30 transition">
          </div>
          <div>
            <label for="password" class="block text-sm text-gray-400 mb-1.5">Нууц үг</label>
            <input type="password" id="password" name="password" required placeholder="Хамгийн багадаа 6 тэмдэгт" minlength="6"
              class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500/30 transition">
          </div>
          <div class="flex items-start gap-2">
            <input type="checkbox" id="terms" name="terms" required class="mt-1 w-4 h-4 rounded border-white/20 bg-white/5 text-teal-500 focus:ring-teal-500/30">
            <label for="terms" class="text-sm text-gray-400">
              Би <a href="#" class="text-teal-400 hover:underline">Үйлчилгээний нөхцөл</a> болон <a href="#" class="text-teal-400 hover:underline">Нууцлалын бодлого</a>-ыг зөвшөөрч байна
            </label>
          </div>
          <button type="submit" id="signup-btn"
            class="w-full bg-teal-500 hover:bg-teal-400 text-indigo-950 font-semibold py-3.5 rounded-full transition text-base mt-2 disabled:opacity-50 disabled:cursor-not-allowed">
            Бүртгүүлэх
          </button>
        </form>

        <div class="relative my-8">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/10"></div></div>
          <div class="relative flex justify-center text-xs"><span class="px-3 bg-indigo-950/80 text-gray-500">эсвэл</span></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button type="button" id="google-btn" class="flex items-center justify-center gap-2 py-3 rounded-xl border border-white/10 hover:bg-white/5 transition text-sm font-medium disabled:opacity-50">
            <svg class="w-4 h-4" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Google
          </button>
          <button type="button" id="facebook-btn" class="flex items-center justify-center gap-2 py-3 rounded-xl border border-white/10 hover:bg-white/5 transition text-sm font-medium disabled:opacity-50">
            <svg class="w-4 h-4" fill="#1877F2" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            Facebook
          </button>
        </div>
      </div>

      <p class="text-center text-sm text-gray-400 mt-8">
        Аль хэдийн бүртгэлтэй юу?
        <a href="login-mn.html" class="text-teal-400 hover:text-teal-300 font-medium transition">Нэвтрэх</a>
      </p>
    </div>
  </main>

  <script src="js/firebase-config.js"></script>
  <script>
    auth.onAuthStateChanged(user => {
      if (user) window.location.href = 'profile-mn.html';
    });

    const errorEl = document.getElementById('error-msg');
    const signupBtn = document.getElementById('signup-btn');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
    }
    function clearMessages() { errorEl.classList.add('hidden'); }
    function setLoading(loading) {
      signupBtn.disabled = loading;
      document.getElementById('google-btn').disabled = loading;
      document.getElementById('facebook-btn').disabled = loading;
      signupBtn.textContent = loading ? 'Бүртгэж байна…' : 'Бүртгүүлэх';
    }

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessages();
      setLoading(true);
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const userCred = await auth.createUserWithEmailAndPassword(email, password);
        await userCred.user.updateProfile({ displayName: name });
      } catch (err) {
        setLoading(false);
        const messages = {
          'auth/email-already-in-use': 'Энэ и-мэйлээр аль хэдийн бүртгэл үүссэн. Нэвтэрнэ үү.',
          'auth/invalid-email': 'И-мэйл хаяг буруу.',
          'auth/weak-password': 'Нууц үг хамгийн багадаа 6 тэмдэгт байх ёстой.',
          'auth/operation-not-allowed': 'Email/Password нэвтрэлт Firebase Console дээр идэвхжээгүй байна.',
        };
        showError(messages[err.code] || err.message);
      }
    });

    document.getElementById('google-btn').addEventListener('click', async () => {
      clearMessages();
      setLoading(true);
      try {
        await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      } catch (err) {
        setLoading(false);
        if (err.code !== 'auth/popup-closed-by-user') showError(err.message);
      }
    });

    document.getElementById('facebook-btn').addEventListener('click', async () => {
      clearMessages();
      setLoading(true);
      try {
        await auth.signInWithPopup(new firebase.auth.FacebookAuthProvider());
      } catch (err) {
        setLoading(false);
        if (err.code !== 'auth/popup-closed-by-user') {
          showError(err.message + ' (Firebase дээр Facebook идэвхжүүлсэн эсэхээ шалгана уу)');
        }
      }
    });
  </script>
</body>
</html>
