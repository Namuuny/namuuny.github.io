<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
  <body class="bg-white text-gray-900">
     <!-- TOP NAV BAR -->

      <a href="index.html" class="flex items-center gap-2.5 group">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-teal-400 via-violet-500 to-coral-400 flex items-center justify-center text-indigo-950 font-bold text-xs">SC</div>
        <span class="font-display font-semibold tracking-tight group-hover:text-teal-400 transition">Smart City Design</span>
      </a>
      
      <div class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-300">
        <a href="#projects" class="hover:text-teal-400 transition">Projects</a>
        <a href="#about" class="hover:text-teal-400 transition">About</a>
        <a href="#contact" class="hover:text-teal-400 transition">Contact</a>
      </div>

      <div class="flex items-center gap-3">
        <a href="indexmn.html" class="text-xs text-gray-400 hover:text-white transition">🌐 EN | МН</a>
        <a href="#contact" class="hidden sm:inline-flex bg-teal-500 hover:bg-teal-400 text-indigo-950 font-semibold text-sm px-5 py-2.5 rounded-full transition">
          Book Consultation
        </a>
      </div>
    </div>
  </nav>
 <div class="pt-24 pb-20 px-6">
    <div class="max-w-2xl mx-auto">
      <div class="text-center mb-16">
        <h1 class="text-5xl md:text-6xl font-semibold leading-tight">Let's discuss your project</h1>
        <p class="mt-6 text-2xl text-gray-600">
          Schedule a 45-minute consultancy call or send us a message.
        </p>
      </div>

      <!-- Scheduling + Contact Form -->
      <div class="bg-white border border-gray-100 rounded-3xl shadow-xl p-10 md:p-12">
       <form action="https://api.web3forms.com/submit" method="POST" class="space-y-8">

  <!-- Hidden Access Key -->
  <input type="hidden" name="access_key" value="6825b6e8-3676-418c-b898-0b528526fe0e">

  <!-- Optional: Subject -->
  <input type="hidden" name="subject" value="New Booking Request - Smart City Design">

  <div>
    <label class="block text-sm font-medium mb-2">Name</label>
    <input type="text" name="name" required class="w-full px-6 py-4 border border-gray-300 rounded-2xl focus:border-teal-600 focus:outline-none text-lg">
  </div>

  <div>
    <label class="block text-sm font-medium mb-2">E-mail</label>
    <input type="email" name="email" required class="w-full px-6 py-4 border border-gray-300 rounded-2xl focus:border-teal-600 focus:outline-none text-lg">
  </div>

  <div>
    <label class="block text-sm font-medium mb-2">Date</label>
    <input type="date" name="preferred_date" required class="w-full px-6 py-4 border border-gray-300 rounded-2xl focus:border-teal-600 focus:outline-none text-lg">
  </div>

  <div>
    <label class="block text-sm font-medium mb-2">Time (45 min)</label>
    <input type="time" name="preferred_time" required min="09:00" max="17:00" step="1800"
           class="w-full px-6 py-4 border border-gray-300 rounded-2xl focus:border-teal-600 focus:outline-none text-lg">
  </div>

  <div>
    <label class="block text-sm font-medium mb-2">Tell me about your project</label>
    <textarea name="message" rows="5" placeholder="Таны ухаалаг хотын санаачлага, хотын сорилт, эсвэл ярилцахыг хүссэн зүйлээ товч тайлбарлана уу..." 
              class="w-full px-6 py-4 border border-gray-300 rounded-2xl focus:border-teal-600 focus:outline-none text-lg"></textarea>
  </div>

  <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white py-5 rounded-2xl font-semibold text-xl transition">
    Send message & Schedule meeting
  </button>
</form>

        <p class="text-center text-sm text-gray-500 mt-10">
          We usually reply within 1–2 business days. All calls are held via Zoom or Google Meet.
        </p>
      </div>
    </div>
  </div>
      
<!-- FOOTER (same) -->
  <footer class="bg-gray-900 text-white py-12 px-6">
    <div class="max-w-7xl mx-auto text-center text-sm">
      © 2026 Smart City Design • All rights reserved
    </div>
  </footer>

</body>
</html>
